development:
  driver: postgresql
  url: {{ DATABASE_URL | default('postgresql://postgres:postgres@localhost:5432/serp_development') }}

test:
  driver: sqlite
  url: {{ DATABASE_URL | default('sqlite:///./test.db') }}

production:
  driver: postgresql
  url: {{ DATABASE_URL | default('postgresql://postgres:postgres@localhost:5432/serp_production') }}
