# tests/pytest.ini
#
# This is the pytest configuration file for the tests directory.
#
# - Use the `pytest` command to run the tests.
# - Use the `pytest -m unit` command to run the unit tests.
# - Use the `pytest -m integration` command to run the integration tests.
# - Use the `pytest -m all` command to run all the tests.
#
# Notes:
# - pythonpath resolves relative to the location of the pytest.ini file, ie.,
#   up one level resolves to the project root.
#
[pytest]
addopts = --strict-markers --tb=short -ra
testpaths = tests/api tests/jobs tests/models tests/services
python_files = *_test.py
pythonpath = ..
markers =
    integration: mark a test as an integration test.
    unit: mark a test as a unit test.
